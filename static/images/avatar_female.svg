<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9A1750" />
      <stop offset="100%" stop-color="#5D001E" />
    </linearGradient>
    <linearGradient id="goldGradF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE08B" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#bgGradF)" rx="100"/>
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#goldGradF)" stroke-width="3"/>
  <g opacity="0.95">
    <!-- Traditional Bun / Mallipoo jasmine flowers -->
    <circle cx="100" cy="65" r="42" fill="#2C3E50"/>
    <path d="M60 70 Q 100 40 140 70" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" fill="none" stroke-dasharray="2,6"/>
    <!-- Head -->
    <circle cx="100" cy="76" r="32" fill="#FAD7A0"/>
    <!-- Hair front partition -->
    <path d="M72 72 Q 100 60 100 78 Q 100 60 128 72 C 125 50, 75 50, 72 72 Z" fill="#2C3E50"/>
    <!-- Bindi (Pottu) & Nethi Chutti -->
    <circle cx="100" cy="72" r="3" fill="#C0392B"/>
    <path d="M100 58 L 100 70" stroke="url(#goldGradF)" stroke-width="1.5"/>
    <circle cx="100" cy="58" r="2.5" fill="url(#goldGradF)"/>
    <!-- Gold Earrings (Jhumka) -->
    <circle cx="68" cy="80" r="3" fill="url(#goldGradF)"/>
    <circle cx="132" cy="80" r="3" fill="url(#goldGradF)"/>
    <!-- Silk Saree & Blouse -->
    <path d="M45 175 C 45 125, 70 120, 100 120 C 130 120, 155 125, 155 175 Z" fill="#E67E22"/>
    <!-- Kanchipuram Saree Pallu / Zari Border -->
    <path d="M65 125 Q 90 145 115 175 L 140 175 Q 105 135 80 120 Z" fill="#800020"/>
    <path d="M80 120 L 140 175" stroke="url(#goldGradF)" stroke-width="4"/>
    <!-- Gold Necklace / Maanga Malai hint -->
    <path d="M82 120 Q 100 135 118 120" stroke="url(#goldGradF)" stroke-width="3" fill="none"/>
  </g>
</svg>
