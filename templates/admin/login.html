{% extends "base.html" %}

{% block title %}Admin Login | {{ t('nav_brand') }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card border-0 shadow-sm rounded-4 p-4 bg-white border-top border-4 border-dark">
                <div class="text-center mb-4">
                    <div class="income-cat-icon mx-auto mb-2 bg-dark text-warning border-warning">
                        <i class="bi bi-shield-lock-fill"></i>
                    </div>
                    <h2 class="h4 fw-bold text-dark m-0">{{ t('admin_title') }}</h2>
                    <p class="text-muted small">Authorized administrators only</p>
                </div>

                <form method="POST" action="{{ url_for('admin.login') }}">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" name="username" class="form-control" placeholder="admin" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn btn-dark w-100 py-3 mt-2">
                        <i class="bi bi-shield-check me-1"></i> Admin Login
                    </button>
                </form>

                <div class="mt-4 p-3 bg-light rounded-3 small">
                    <div class="fw-bold text-secondary mb-1">Demo Admin Credentials:</div>
                    <div>User: <code>admin</code></div>
                    <div>Pass: <code>Admin@123</code></div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
